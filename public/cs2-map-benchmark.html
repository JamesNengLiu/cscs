</style></head><body><canvas id="map"></canvas><aside class="panel"><h1>Dust2 · 地图性能验证</h1><p class="muted" id="scope">独立渲染页，不加入游戏房间，不改动 1.0。真实 CS2 主结构，简化材质；不代表原版 CS2 画质或完整游戏性能。</p><label>地图<select id="dataset"><option value="optimized">CS2 · 剔除、合批与分级加载</option><option value="textured">CS2 · 原始贴图与烘焙光照</option><option value="cs2">CS2 · 简化材质验证包</option><option value="legacy">1.0 · 原地图渲染对照</option></select></label><div class="buttons" id="views"></div><label><input type="checkbox" id="actors">9 个现有 1.0 动画人物（渲染压力）</label><label><input type="checkbox" id="effects">烟雾透明层与粒子压力（程序化）</label><label>渲染比例<select id="ratio"><option value="1">固定 1.0 · 不自动降画质</option><option value="0.85">固定 0.85</option><option value="0.7">固定 0.7</option></select></label><div class="buttons"><button id="tour">自动巡游</button><button id="export">导出诊断</button></div><p class="muted">拖动鼠标观察，WASD / Q / E 自由观察，Shift 加速。这里没有玩家碰撞或射击逻辑，不用于评判移动手感。</p><pre id="metrics">准备加载…</pre><p id="error"></p></aside><div id="loading"><div id="progress">准备验证资源…</div></div><script type="module" src="/cs2-map-benchmark.js?v=optimized-20261105"></script></body></html>
